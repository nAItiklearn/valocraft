[package]
name = "authc"
version = "1.0.0"
authors = ["Acrimon <joel.wejdenstal@gmail.com>"]
edition = "2018"

[dependencies]
http = "1.1"
hyper = { version = "1", default-features = false, features = [
    "client",
    "http1",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "native-tokio",
] }
hyper-util = "0.1"
http-body-util = "0.1"
bytes = "1"
serde_json = "1.0"
serde = { version = "1.0.115", features = ["derive"] }
uuid = { version = "1.8", default-features = false, features = ["serde", "v4"] }
auth-common = { path = "../common" }
hex = "0.4.3"
fxhash = "0.2.1"
rust-argon2 = { version = "2.1.0", default-features = false }
