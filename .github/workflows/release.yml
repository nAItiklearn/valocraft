name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Portable release layout: userdata is created beside the executable.
  VELOREN_USERDATA_STRATEGY: executable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-assets:
    name: Prepare game assets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify assets are not LFS pointers
        shell: bash
        run: |
          set -euo pipefail
          head -n 1 assets/common/canary.canary | grep -qx "VELOREN_CANARY_MAGIC"
          test -f assets/voxygen/logo.ico
          test -f assets/voxygen/logo-windows.ico
          test "$(wc -c < assets/voxygen/logo-windows.ico)" -gt 1000

      - name: Archive assets for the build jobs
        shell: bash
        run: |
          set -euo pipefail
          tar -czf valocraft-assets.tar.gz assets

      - name: Upload prepared assets
        uses: actions/upload-artifact@v4
        with:
          name: valocraft-assets
          path: valocraft-assets.tar.gz
          if-no-files-found: error
          retention-days: 2

  build:
    name: ${{ matrix.name }}
    needs: prepare-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            profile: release-thinlto
            python: python3
            macos_target: ""
            optional: false
          - name: Windows x86_64
            os: windows-2022
            platform: windows
            arch: x86_64
            profile: release-thinlto
            python: python
            macos_target: ""
            optional: false
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            arch: aarch64
            profile: release-thinlto
            python: python3
            macos_target: "11.0"
            optional: false
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            arch: x86_64
            profile: release-thinlto
            python: python3
            macos_target: "10.15"
            optional: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Download prepared assets
        uses: actions/download-artifact@v4
        with:
          name: valocraft-assets
          path: .

      - name: Restore prepared assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets
          tar -xzf valocraft-assets.tar.gz

      - name: Install Rust toolchain
        run: rustup show

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.8"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang lld ninja-build \
            libasound2-dev libudev-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev \
            libssl-dev libsqlite3-dev

      - name: Install macOS Ninja
        if: matrix.platform == 'macos'
        run: brew install ninja

      - name: Install Windows Ninja
        if: matrix.platform == 'windows'
        run: choco install ninja -y --no-progress

      - name: Set up MSVC developer environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select the MSVC linker
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # Git for Windows puts a Unix `link.exe` in /usr/bin.  Rust must use
          # the MSVC linker from the Visual Studio toolchain, not that one.
          if [ -n "${VCToolsInstallDir:-}" ]; then
            msvc_bin="$(cygpath -u "$VCToolsInstallDir")/bin/Hostx64/x64"
          else
            cl_path="$(cygpath -u "$(where cl | head -n 1 | tr -d '\r')")"
            msvc_bin="$(dirname "$cl_path")"
          fi
          test -x "$msvc_bin/link.exe"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -w "$msvc_bin/link.exe")" >> "$GITHUB_ENV"
          echo "Using MSVC linker: $(cygpath -w "$msvc_bin/link.exe")"

      - name: Build client
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: |
          set -euo pipefail
          cargo build --locked --profile "${{ matrix.profile }}" \
            --bin veloren-voxygen \
            --no-default-features --features default-publish,shaderc-from-source

      - name: Build dedicated server
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: |
          set -euo pipefail
          cargo build --locked --profile "${{ matrix.profile }}" \
            --bin veloren-server-cli

      - name: Stage binaries and free build space
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-bin
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "target/${{ matrix.profile }}/veloren-voxygen.exe" .release-bin/
            cp "target/${{ matrix.profile }}/veloren-server-cli.exe" .release-bin/
          else
            cp "target/${{ matrix.profile }}/veloren-voxygen" .release-bin/
            cp "target/${{ matrix.profile }}/veloren-server-cli" .release-bin/
          fi
          rm -rf target

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.python }}" scripts/package_release.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ inputs.tag || github.ref_name }}" \
            --binary-dir .release-bin \
            --out-dir dist

      - name: Show package sizes
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Valocraft-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  release:
    name: Publish GitHub Release
    needs: build
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      # The release job intentionally has no checkout, so give gh the
      # repository context explicitly.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Valocraft-*
          path: dist
          merge-multiple: true

      - name: Verify required packages exist
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find dist -maxdepth 1 -type f -iname '*windows*' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -iname '*linux*' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -iname '*macos*aarch64*' -print -quit)"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GH_REPO}/releases/download/${TAG}"
          {
            cat <<EOF
          ## Valocraft desktop release

          This release contains the portable desktop client and the optional
          dedicated server. **Desktop only: Windows, macOS, and Linux.**

          ### Downloads

          | Platform | File |
          |---|---|
          | **Windows 10/11 (x86_64)** | [Valocraft-${TAG}-windows-x86_64.zip](${BASE}/Valocraft-${TAG}-windows-x86_64.zip) |
          | macOS Apple Silicon | [Valocraft-${TAG}-macos-aarch64.dmg](${BASE}/Valocraft-${TAG}-macos-aarch64.dmg) |
          | macOS Intel | [Valocraft-${TAG}-macos-x86_64.dmg](${BASE}/Valocraft-${TAG}-macos-x86_64.dmg) |
          | Linux (x86_64) | [Valocraft-${TAG}-linux-x86_64.tar.gz](${BASE}/Valocraft-${TAG}-linux-x86_64.tar.gz) |
          | Checksums | [SHA256SUMS.txt](${BASE}/SHA256SUMS.txt) |

          > Download the game archive for your platform from the table above —
          > **not** GitHub's \`Source code (zip)\`.

          - **Windows:** extract the \`.zip\`, then run \`run.bat\`. If the
            browser or SmartScreen warns about an uncommon unsigned download,
            choose **Keep** / **More info → Run anyway**. Verify the SHA-256
            hash against \`SHA256SUMS.txt\` if unsure.
          - **macOS:** open the \`.dmg\` and drag Valocraft to Applications, or
            extract the \`.tar.gz\`. The build is unsigned; right-click the app
            and choose **Open** the first time.
          - **Linux:** extract the \`.tar.gz\`, then run \`./run.sh\`.

          The full platform notes, runtime packages, build instructions, and
          troubleshooting steps are in [\`RUNNING.md\`](https://github.com/nAItiklearn/valocraft/blob/main/RUNNING.md).
          EOF
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Valocraft $TAG" --notes-file release-notes.md
          else
            create_args=(
              --title "Valocraft $TAG"
              --notes-file release-notes.md
              --target "$GITHUB_SHA"
            )
            if [ "$PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$TAG" dist/* "${create_args[@]}"
          fi

          # A tag-triggered desktop release is the primary download; make sure
          # it is presented as the latest release.
          if [ "$PRERELEASE" != "true" ]; then
            gh release edit "$TAG" --latest
          fi

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee published-assets.txt
          grep -qi 'windows' published-assets.txt
          grep -qi 'linux' published-assets.txt
          grep -qi 'macos.*aarch64' published-assets.txt

      - name: Remove stale and non-desktop releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for old in v0.1.0 v0.1.1; do
            if [ "$old" != "$TAG" ]; then
              gh release delete "$old" --yes 2>/dev/null || true
            fi
          done
          # Valocraft is desktop-only. Remove the experimental Android release
          # so players can no longer download the wrong variant.
          gh release delete android-v0.1.2 --yes --cleanup-tag 2>/dev/null || true
